# perilune_benchmarks.toml for slot-hashes-crate

[[benchmark]]
id = "slot_hashes_from_account_info"
function = "slot_hashes_crate::instruction::process_instruction"
entrypoints = ["pinocchio", "pinocchio-std", "solana-program", "solana-program-mono"]
features = [
    { entrypoint = "pinocchio", features = ["no_std"] },
    { entrypoint = "pinocchio-std", features = ["std", "host"] },
    { entrypoint = "solana-program", features = ["solana-program"] },
    { entrypoint = "solana-program-mono", features = ["solana-program-mono"] }
]
instruction_payload = { tag = 0 }

