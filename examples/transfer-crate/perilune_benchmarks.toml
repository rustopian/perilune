# perilune_benchmarks.toml for transfer-crate

[[benchmark]]
id = "transfer_solana"
function = "transfer_crate::solana_benches::run_transfer_bench"
entrypoints = ["solana-program"]
features = [
    { entrypoint = "solana-program", features = ["solana-program"] }
]
# Using dotted keys for instruction_payload
instruction_payload.tag = 0
instruction_payload.amount = 1000000000
# Accounts: Source, Destination, SystemProgram (to be handled by executor setup)

[[benchmark]]
id = "transfer_solana_mono"
function = "transfer_crate::solana_program_mono_benches::run_transfer_bench"
entrypoints = ["solana-program-mono"]
